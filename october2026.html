<!DOCTYPE html>
<html>
<body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=0.75">

   <style>
   body {
      background-color: DarkSlateGray;
}

      h1 {
         text-align: center;
         color: FloralWhite;
      }

      ul {
         color: FloralWhite;
      }

       table, th, td {
            border: 3px dotted FloralWhite;
          margin-top: 100px;
                    }
table {
  border-collapse: collapse;
  width: 100%;
  table-layout: fixed;
}
td {
  padding: 5px;
}
td img {
  width: 100%;
  height: auto;
  max-width: 100%;
  display: block;
}
td.text-cell {
  vertical-align: top;
  color: Wheat;
  font-size: 1rem;
  font-weight: normal;
}
td.text-cell p {
  margin: 0 0 1em 0;
}
@media screen and (max-width: 768px) {
  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
}
  footer {
            text-align: center;
            color: FloralWhite;
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
       }

     /* unvisited link */
a:link {
  color: FloralWhite;
}

/* visited link */
a:visited {
  color: FloralWhite;
}
     </style>

  <h1>October 2026</h1>

   <footer>
  <a href="blog.html">blog</a>
</footer>
    </body>
</html>
