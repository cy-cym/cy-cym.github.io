<!DOCTYPE html>
<html>
<body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=0.75">

   <style>
   body {
      background-color: DarkSlateGray;
}

      h1 {
         text-align: center;
         color: FloralWhite;
      }

      ul {
         color: FloralWhite;
      }
     
    table, th, td {
            border:1px solid FloralWhite;
                    }
        img {
  max-width: 100%;
  height: auto;
  display: block;
}

table {
  border-collapse: collapse;
  width: 100%;
  table-layout: fixed;
}

td {
  width: 33.33%; /* Keep 3 columns */
  padding: 5px;
}

@media screen and (max-width: 768px) {
  .table-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  table {
    width: 600px; /* Fixed width so it scrolls instead of compressing */
  }
}
      
      footer {
            text-align: center;
            color: FloralWhite;
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
       }

     /* unvisited link */
a:link {
  color: FloralWhite;
}

/* visited link */
a:visited {
  color: FloralWhite;
}
     </style>

  <h1>September 2026</h1>


   <footer>
  <a href="blog.html"</a>
            blog
</footer>
    </body>
</html>
